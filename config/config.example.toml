# Copy to: $XDG_CONFIG_HOME/aiuse/config.toml (or ~/.config/aiuse/config.toml).
# This is the single canonical user configuration file. Keep it small: every
# setting below is optional, because aiuse supplies useful built-in defaults.

[timeouts]
# Wall-clock seconds for external tools. Per-tool entries override default.
# default = 45
# cswap = 90       # cswap list --json crossed 45s beside the other collectors
# codexbar = 45
# openusage_ai = 45  # OpenUsage.ai macOS menu-bar app
# openusage_sh = 90  # OpenUsage.sh export polls every provider; 45s often kills a live run
# caam = 90          # caam limits --format json sweeps 4 providers under caam's own 60s deadline
# opencode_zen = 45 # direct OpenCode Zen billing (when its session cookie is supplied)
# muse = 45       # Muse: Bearer (META_API_KEY) or cookie (dev.meta.ai); mutual failover
# qwencloud = 45  # qwencloud CLI (`qwencloud auth login` once; no API-key mode)
# bailian = 45    # bailian-cli / bl (`bl auth login --console` once)
# grok_billing = 15  # native Grok Extra Usage Credits billing (~/.grok/auth.json)
# tokscale = 45

[collectors.caut]
# Set false when caut is not installed or its Keychain access is unwanted.
# enabled = false

[collectors.caam]
# Coding Agent Account Manager vault-profile limits (claude/codex/grok/cursor).
# Last-resort source behind the direct collectors; needs vault profiles — a
# live login without a vault quota row emits nothing. See docs/caam.md.
# enabled = true

[collectors.codexbar]
# "enabled" honors CodexBar's own provider list; use "all" or a CSV to override.
# providers = "enabled"
# Per-provider query timeout (seconds) instead of timeouts.codexbar; a CLI
# --timeout still wins. Use for a provider that is slow or known to hang.
# The built-in default is provider_timeouts.opencodego = 60 (CodexBar's own
# web timeout). OpenCode Go is queried with --source web only; a miss does
# not fall through to the local SQLite rescan.
# provider_timeouts = { alibabatokenplan = 10 }
# A provider whose query hits its timeout is skipped for this many seconds,
# doubling per further consecutive timeout (cap 12x). 0 disables.
# timeout_backoff = 1800

[collectors.openusage_ai]
# OpenUsage.ai — the macOS menu-bar app's CLI / loopback API.
# enabled = true

[collectors.openusage_sh]
# OpenUsage.sh — terminal dashboard, invoked through `openusage-sh`.
# enabled = true

[collectors.deepseek]
# Native DeepSeek prepaid balance (GET /user/balance, read-only, no tokens).
# Quiet until AIUSE_DEEPSEEK_API_KEY or SecretSpec DEEPSEEK_API_KEY is set.
# enabled = true

[collectors.opencode_zen]
# Optional direct OpenCode Zen billing source. Enable it by exporting
# AIUSE_OPENCODE_ZEN_COOKIE with an existing OpenCode console Cookie header.
# The cookie is never stored in this file.
# enabled = true

[collectors.opencode_go]
# Same console cookie as Zen. Reads the official /go page so a lapsed plan
# shows empty / subscription expired instead of CodexBar's local leftover %.
# enabled = true

[collectors.muse]
# Dual-auth with automatic failover. Bearer is preferred (stable):
#   AIUSE_MUSE_API_KEY or META_API_KEY (or: muse login / muse auth set)
# Cookie fallback: browser session from dev.meta.ai — refresh via:
#   aiuse credential refresh muse --from chrome --profile Default
# The cookie is never stored in this file; team_id auto-scraped or AIUSE_MUSE_TEAM_ID.
# enabled = true

[collectors.qwencloud]
# QwenCloud (qwencloud.com) native CLI. One-time OAuth setup:
#   qwencloud auth login   (PKCE/device flow; there is no API-key mode)
# Surfaces coding-plan 5h/weekly/monthly windows, token-plan credits,
# and PAYG spend vs the `qwencloud billing limit` cap.
# enabled = true

[collectors.bailian]
# Alibaba Cloud (Bailian / Model Studio) plans, distinct from qwencloud.com.
# One-time console OAuth: bl auth login --console
# Surfaces token/coding-plan 5h + weekly quota windows via `bl usage`.
# enabled = true

[collectors.sipb]
# MIT SIPB LLM server (llms-dev-1.mit.edu). Opt-in only.
# Unlimited quota but very slow (shared GPU) — use sparingly / as a last resort.
# Requires MITnet or VPN. Set MIT_SIPB_API_KEY (or secretspec) for auth'd models.
# enabled = false

[collectors.acp]
# Context-window fill and per-turn tokens from acp-run JSONL logs
# (~/.local/state/acp-run, or AIUSE_ACP_LOG_DIR). Passive: aiuse does not
# start a turn. This is not 5h/weekly plan quota. See docs/acp-usage.md.
# enabled = true
# log_dir = "~/.local/state/acp-run"
# max_age_hours = 168   # 0 keeps every log

# Pin one collector as the only reading for a service. Omit a provider, or
# set "blend", to keep source priority and attach ACP context beside it.
# [usage_sources]
# claude = "cswap"
# antigravity = "acp"

[collectors.grok_billing]
# Grok Extra Usage Credits (prepaid wallet) via the local `grok` CLI's billing
# endpoint; needs a one-time `grok` CLI login (~/.grok/auth.json). Supplements
# the SuperGrok weekly pool from CodexBar/OpenUsage — see docs/grok-quota.md.
# enabled = false   # when you do not use the grok CLI on this machine

[query_min_interval]
# Minimum seconds between live quota queries of one provider, enforced across
# every aiuse process (CLI, `aiuse sample` LaunchAgent, watch, serve) through a
# lock file under ~/.cache/aiuse/query-throttle/. While throttled, CodexBar's
# last result is reused and OpenUsage's refresh is not forced. 0 disables.
# After 3 live answers in a row with no usable data the interval stretches 4x
# per further empty answer (cap 6h); one usable answer resets it.
# antigravity = 900  # agy 429s on quota probes in quick succession

# Usually unnecessary: aiuse automatically unifies a provider when every live
# source reports exactly one named account.  For a genuinely multi-account
# provider, map a source-local id to the account label used elsewhere.
# [account_aliases.codex.openusage_sh]
# "codex-cli" = "me@example.com"

[analysis]
# Persist hourly/manual snapshots for History learning.
# persist_snapshots = true
# learn_from_history = "auto" # true | false | auto
# fresh_threshold_seconds = 1500 # cached snapshot counts as fresh under this age (seconds)
# agy_cli_lockout_minutes = 60  # scan agy CLI logs this far back for 429s (client_limits); 0 off

# Operator-declared dead subscriptions: "provider/account" = reason (or true).
# A not-renewed plan keeps serving stale collector cache that looks like usable
# quota; aiuse cannot see renewal state, so declare it here and the account
# shows as empty instead of on-pace.
# [analysis.lapsed_accounts]
# "claude/me@mit.edu" = "not renewed 2026-08"

# Operator routing exclusions: "provider" or "provider/pool_family" = reason (or
# true). The quota is real and still reported, but `aiuse --available` leaves
# the pool out of the shortlist and lists it under `excluded` with the reason.
# [analysis.excluded_pools]
# "grok" = "operator: reserve this vendor for another agent, 2026-10-06"

# Operator-disabled services — stronger than excluded_pools: "provider" =
# reason (or true). The service is off-limits overall: provider-only collectors
# skip it, its rows are dropped from every report/snapshot/history entry, and
# `aiuse --available` never lists it (even from a cache written before the
# entry). For TUIs that must temporarily not be used even with headroom.
# [disabled_services]
# "grok" = "operator: vendor shelved this week (2026-10-08)"

[analysis.pace]
# waste_alert_fraction = 0.30
# min_elapsed_fraction = 0.15
# conserve_min_lead_hours = 4.0

[plans.copilot]
# Override plan metadata when it differs from the built-in Individual plan.
# monthly_price = 10

# Optional macOS codesign identity for `aiuse trust sign-caut`.
# [macos]
# codesign_identity = "aiuse-local-codesign"
