# ralph.yml for the US-005 supervised run (aiuse-juk.5). Copy it to ralph.yml
# in a SEPARATE CLONE of aiuse (not a git worktree: ralph v2.10.1's landing
# sequence runs `git stash clear`, and worktrees share one stash list), then
# replace __TASK_ID__ with the bead the operator picked. Runbook:
# docs/orchestration/README.md, section US-005.
#
# Written against the ralph-cli v2.10.1 release binary's accepted keys, checked
# with `ralph hooks validate`. Unknown keys are silently ignored by ralph, so
# do not add keys from HEAD docs without re-running that check.
#
# The hooks run PINNED copies of judge.sh and cswap-gate.sh, installed from
# origin/main outside the clone (runbook step "Pin the hook scripts"). The
# agent writes to the clone, so hooks that ran the clone's own scripts could be
# rewritten to `exit 0` by the very loop they judge.
---
cli:
  backend: claude
event_loop:
  max_iterations: 10
  completion_promise: LOOP_COMPLETE
hooks:
  enabled: true
  defaults:
    timeout_seconds: 120
    max_output_bytes: 8192
  events:
    # Record this loop's starting HEAD, its loop id and the judge's own hash,
    # outside the clone, so the judge measures only this loop's commits.
    pre.loop.start:
      - name: judge-start
        command: ["/Users/djbclark/.local/state/aiuse-ralph/pinned/judge.sh", "--record-start"]
        on_error: block
        timeout_seconds: 60
        env:
          JUDGE_STATE_DIR: "/Users/djbclark/.local/state/aiuse-ralph/judge-state"
    # Quota gate: refuse a new iteration at >= 80% of the active Claude 5h
    # window. It never switches accounts.
    pre.iteration.start:
      - name: cswap-gate
        command: ["/Users/djbclark/.local/state/aiuse-ralph/pinned/cswap-gate.sh"]
        on_error: block
        timeout_seconds: 120
    # Completion authority: tracker + git + the real `just check`.
    pre.loop.complete:
      - name: judge
        command: ["/Users/djbclark/.local/state/aiuse-ralph/pinned/judge.sh"]
        on_error: block
        timeout_seconds: 3600
        env:
          TASK_ID: "__TASK_ID__"
          EXPECT_DIFF: "yes"
          # bg caps parallelism and takes a machine-wide test slot.
          TEST_CMD: "/Users/djbclark/ops/site-private/bin/bg just check"
          # The judge kills the test run and refuses after this many seconds.
          # Keep it below timeout_seconds above, so the judge gives the
          # verdict instead of ralph's hook timeout. bg's wait for load and a
          # test slot (up to 900 + 1800 s) counts against it.
          JUDGE_TEST_TIMEOUT: "3300"
          # The beads database lives in the operator's main checkout.
          BD_DIR: "/Users/djbclark/src/aiuse"
          # Same state dir as judge-start; no JUDGE_BASE, so the recorded
          # loop start is the base.
          JUDGE_STATE_DIR: "/Users/djbclark/.local/state/aiuse-ralph/judge-state"
