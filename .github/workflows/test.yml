---
name: test
"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install just
        uses: extractions/setup-just@v3
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install Python quality tools
        run: uv sync --extra dev
      - name: Install documentation quality tools
        run: bun install --frozen-lockfile
      - name: Run tests
        run: uv run pytest
      - name: Run pre-commit quality and security checks
        run: uv run pre-commit run --all-files
      - name: Check justfile formatting
        run: just --fmt --check

  deb:
    # Build the Debian package, install it with apt, and run it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Build .deb
        run: python3 packaging/build_deb.py --out-dir dist-deb
      - name: Install .deb
        run: sudo apt-get update && sudo apt-get install -y ./dist-deb/aiuse_*_all.deb
      - name: Smoke test
        run: |
          /usr/bin/aiuse --version
          /usr/bin/ai --version
          /usr/bin/aiuse --help >/dev/null

  nix:
    # Build the flake (runs the test suite in the Nix sandbox) and check outputs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: nix flake check
        run: nix flake check -L
      - name: nix run
        run: nix run . -- --version
