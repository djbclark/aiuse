# Publish aiuse to PyPI via Trusted Publishing (OIDC).
#
# Publisher is configured on https://pypi.org/manage/project/aiuse/settings/publishing/
#   Owner: djbclark | Repository: aiuse | Workflow: publish.yml | Environment: pypi
# GitHub Environment "pypi" must exist on this repo.
# Docs: docs/packaging.md — verified with release v2.1.1.
---
name: publish

"on":
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aiuse
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  deb:
    # Attach the reproducible aiuse_<version>_all.deb to the GitHub release.
    # Built from the same tree as the PyPI wheel; see docs/packaging.md.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Build wheel
        run: python -m build --outdir dist
      - name: Build .deb
        run: python packaging/build_deb.py --wheel dist/aiuse-*-py3-none-any.whl --out-dir dist-deb
      - name: Upload .deb to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist-deb/*.deb --clobber --repo "$GITHUB_REPOSITORY"
