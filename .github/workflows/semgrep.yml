---
name: semgrep
"on":
  push:
    branches: [main]
  pull_request:

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install semgrep
        run: uv pip install --system semgrep
      - name: Run semgrep
        run: semgrep scan --config p/default --error --exclude .github
